<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>Voice Counter</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc; color: #1e293b;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .counter { font-size: 6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
    button {
      padding: 0.75rem 1.5rem; font-size: 1.125rem; border: none; border-radius: 0.5rem;
      background: #2563eb; color: white; cursor: pointer; transition: background 0.1s;
    }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    button:not(:disabled):active { background: #1d4ed8; }
    button.secondary { background: #64748b; }
    button.secondary:not(:disabled):active { background: #475569; }
    button.danger { background: #ef4444; }
    button.danger:not(:disabled):active { background: #dc2626; }
    .mic-btn {
      width: 80px; height: 80px; border-radius: 50%; border: none;
      background: #2563eb; color: white; font-size: 2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(37,99,235,0.4);
      transition: transform 0.1s, background 0.1s;
    }
    .mic-btn:not(:disabled):active { transform: scale(0.95); background: #1d4ed8; }
    .mic-btn.listening { background: #ef4444; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 50% { box-shadow: 0 0 0 16px rgba(239,68,68,0); } }
    .debug { display: flex; gap: 0.5rem; width: 100%; max-width: 400px; }
    .debug input { flex: 1; padding: 0.5rem; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; }
    .status { font-size: 0.875rem; color: #64748b; min-height: 1.25rem; text-align: center; width: 100%; max-width: 400px; }
    .raw-output { font-family: monospace; font-size: 0.75rem; color: #94a3b8; white-space: pre-wrap; word-break: break-word; max-width: 400px; text-align: left; }
    .install-hint { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-size: 0.875rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .install-hint.show { opacity: 1; }
    /* Model load status line */
    .model-load-status {
      font-size: 0.75rem; color: #475569;
      text-align: center; width: 100%; max-width: 400px;
      font-family: monospace; margin: 0.5rem 0;
    }
    .model-load-status.downloading { color: #2563eb; }
    .model-load-status.loaded { color: #059669; }
    /* Debug log panel */
    .debug-panel { width: 100%; max-width: 600px; background: #1e293b; color: #e2e8f0; padding: 0.5rem; border-radius: 0.5rem; font-family: monospace; font-size: 0.7rem; max-height: 200px; overflow-y: auto; }
    .debug-entry { padding: 0.1rem 0; border-bottom: 1px solid #334155; }
    .debug-entry.error { color: #f87171; }
    .debug-entry.progress { color: #60a5fa; }
    .debug-entry.debug { color: #a3e635; }
  </style>
</head>
<body>
  <h1>Voice Counter</h1>
  <div class="counter" id="counter">0</div>
  <div class="controls">
    <button id="incrementBtn">+1</button>
    <button id="decrementBtn" class="secondary">-1</button>
    <button id="resetBtn" class="danger">Reset</button>
  </div>
  <button class="mic-btn" id="micBtn" disabled title="Needle loading…">🎤</button>
  <div class="debug">
    <input type="text" id="debugInput" placeholder="Type command (e.g., add three)" disabled>
    <button id="debugBtn" disabled>Run</button>
  </div>
  <div class="status" id="status">Loading Needle…</div>
  <div class="model-load-status" id="modelLoadStatus">0 / 60.5 MB loaded</div>
  <div class="raw-output" id="rawOutput"></div>
  <div class="debug-panel" id="debugPanel"></div>
  <div class="install-hint" id="installHint">Install app for offline use</div>

  <script>
    // --- Counter state ---
    let count = parseInt(localStorage.getItem('voice-counter') || '0', 10);
    const counterEl = document.getElementById('counter');
    const statusEl = document.getElementById('status');
    const rawOutputEl = document.getElementById('rawOutput');
    const micBtn = document.getElementById('micBtn');
    const debugInput = document.getElementById('debugInput');
    const debugBtn = document.getElementById('debugBtn');
    const installHint = document.getElementById('installHint');
    const debugPanel = document.getElementById('debugPanel');

    function render() { counterEl.textContent = count; }
    function save() { localStorage.setItem('voice-counter', String(count)); }
    function setStatus(msg) { statusEl.textContent = msg; }
    function setRawOutput(text) { rawOutputEl.textContent = text; }

    function addDebugEntry(message, data = null, className = 'debug') {
      const entry = document.createElement('div');
      entry.className = `debug-entry ${className}`;
      const time = new Date().toLocaleTimeString();
      let text = `[${time}] ${message}`;
      if (data) text += ' ' + JSON.stringify(data);
      entry.textContent = text;
      debugPanel.appendChild(entry);
      debugPanel.scrollTop = debugPanel.scrollHeight;
    }

    // --- Basic button handlers (work without Needle) ---
    document.getElementById('incrementBtn').onclick = () => { count++; save(); render(); };
    document.getElementById('decrementBtn').onclick = () => { count--; save(); render(); };
    document.getElementById('resetBtn').onclick = () => { count = 0; save(); render(); };

    // --- Needle Worker wiring ---
    addDebugEntry('Creating Needle worker...');
    const worker = new Worker('needle.worker.js');
    worker.onerror = (e) => {
      addDebugEntry(`Worker error: ${e.message}`, { filename: e.filename, lineno: e.lineno, colno: e.colno }, 'error');
    };
    let workerReady = false;
    let pendingId = 0;
    const pending = new Map();

    // Tool schemas for Needle (matching CactusCompute demo format)
    const tools = [
      {
        name: 'modify',
        description: 'Change the counter by a positive or negative amount. Use positive numbers to add to the counter, negative numbers to subtract from the counter.',
        parameters: {
          type: 'object',
          properties: {
            amount: {
              type: 'number',
              description: 'The amount to change the counter by. Positive numbers increase the counter (e.g., 5, +3). Negative numbers decrease the counter (e.g., -5, -3). Can be any integer.'
            }
          },
          required: ['amount']
        },
        triggers: [
          "^(?!.*\\b(and|then|also)\\b).*\\b(add|plus|increase|more|higher|count up)\\b.*\\d+",
          "^(?!.*\\b(and|then|also)\\b).*\\b(subtract|minus|decrease|less|lower|reduce|take away)\\b.*\\d+",
          "^(?!.*\\b(and|then|also)\\b).*[+-]\\s*\\d+",
          "^\\-\\s*\\d+",
          "^\\+\\s*\\d+"
        ]
      },
      {
        name: 'reset',
        description: 'Reset the counter to zero.',
        parameters: {
          type: 'object',
          properties: {},
          required: []
        },
        triggers: [
          "^(?!.*\\b(and|then|also)\\b).*\\b(reset|zero|clear)\\b"
        ]
      }
    ];

    worker.onmessage = (e) => {
      const { type, id, output, error, ready, message, data } = e.data;
      addDebugEntry(`MAIN received: ${type}`, e.data);
      if (type === 'debug') {
        addDebugEntry(message, data, 'debug');
        return;
      }
      if (type === 'ready') {
        workerReady = true;
        micBtn.disabled = false;
        debugInput.disabled = false;
        debugBtn.disabled = false;
        micBtn.title = 'Tap to speak';
        setStatus('Ready — tap mic or type a command');
        addDebugEntry('Worker ready! UI unlocked.', { loadedBytes: window.loadedBytes }, 'progress');
        return;
      }
      if (type === 'error') {
        const errMsg = 'Error: ' + (error || 'unknown error');
        setStatus(errMsg);
        addDebugEntry(errMsg, null, 'error');
        return;
      }
      if (type === 'progress') {
        const modelLoadStatus = document.getElementById('modelLoadStatus');
        const stage = e.data.stage;

        // Track loaded bytes and expected total dynamically
        if (!window.loadedBytes) {
          window.loadedBytes = 0;
        }
        if (!window.expectedSizes) {
          window.expectedSizes = new Map(); // filename -> size
        }
        if (!window.expectedTotalBytes) {
          window.expectedTotalBytes = 0;
        }

        // Normalize filename by stripping cache buster (?v=...)
        function normalizeFilename(url) {
          if (!url) return 'unknown';
          return url.split('?')[0].split('/').pop();
        }

        function updateExpectedTotal(sizeBytes, url) {
          const filename = normalizeFilename(url);
          if (sizeBytes > 0 && !window.expectedSizes.has(filename)) {
            window.expectedSizes.set(filename, sizeBytes);
            window.expectedTotalBytes += sizeBytes;
          }
        }

        function getTotalMB() {
          return (window.expectedTotalBytes / 1024 / 1024).toFixed(1);
        }

        // Debug: log every progress message
        addDebugEntry(`Progress: ${stage}`, { size: e.data.size, loaded: e.data.loaded, total: e.data.total, url: e.data.url, loadedBytes: window.loadedBytes, expectedTotal: window.expectedTotalBytes }, 'progress');

        // Handle cache HIT - accumulate loaded bytes and track expected size
        if (stage.startsWith('cache HIT') || stage === 'cache HIT') {
          const sizeBytes = e.data.size || 0;
          const filename = e.data.url || 'unknown';
          updateExpectedTotal(sizeBytes, filename);
          window.loadedBytes += sizeBytes;
          const loadedMB = (window.loadedBytes / 1024 / 1024).toFixed(1);
          modelLoadStatus.textContent = `${loadedMB} / ${getTotalMB()} MB loaded`;
          modelLoadStatus.className = 'model-load-status loaded';
          addDebugEntry(`Cache HIT handled, loadedBytes: ${window.loadedBytes}, expectedTotal: ${window.expectedTotalBytes}`, null, 'progress');
          return;
        }

        // Handle cache MISS - just note it but don't reset loaded bytes
        if (stage.startsWith('cache MISS')) {
          // Keep showing current loaded state
          return;
        }

        // Handle model download progress - show model download vs model size
        if (stage === 'downloading model') {
          const loaded = e.data.loaded || 0;
          const total = e.data.total || 0;
          const loadedMB = (loaded / 1024 / 1024).toFixed(1);
          const totalMB = (total / 1024 / 1024).toFixed(1);
          // Update expected total with model size if not already tracked
          if (total > 0) {
            updateExpectedTotal(total, 'tuned_needle3_gpu.cact');
          }
          modelLoadStatus.textContent = `${loadedMB} / ${totalMB} MB downloading (${getTotalMB()} MB total)`;
          modelLoadStatus.className = 'model-load-status downloading';
          return;
        }

        // Handle model loaded from cache (fetching model with size)
        if (stage === 'fetching model' && e.data.size) {
          const sizeBytes = e.data.size;
          updateExpectedTotal(sizeBytes, 'tuned_needle3_gpu.cact');
          window.loadedBytes += sizeBytes;
          const loadedMB = (window.loadedBytes / 1024 / 1024).toFixed(1);
          modelLoadStatus.textContent = `${loadedMB} / ${getTotalMB()} MB loaded`;
          modelLoadStatus.className = 'model-load-status loaded';
          return;
        }

        // Handle file cached notification
        if (stage === 'cached') {
          const sizeBytes = e.data.size || 0;
          const filename = e.data.url || 'unknown';
          updateExpectedTotal(sizeBytes, filename);
          window.loadedBytes += sizeBytes;
          const loadedMB = (window.loadedBytes / 1024 / 1024).toFixed(1);
          modelLoadStatus.textContent = `${loadedMB} / ${getTotalMB()} MB loaded`;
          modelLoadStatus.className = 'model-load-status loaded';
          return;
        }

        // Handle model loading stages
        if (stage === 'reading model' || stage === 'loading model' || stage === 'initializing model') {
          // Keep showing the loaded state with dynamic total
          const loadedMB = (window.loadedBytes / 1024 / 1024).toFixed(1);
          modelLoadStatus.textContent = `${loadedMB} / ${getTotalMB()} MB loaded`;
          modelLoadStatus.className = 'model-load-status loaded';
          return;
        }

        // Handle other stages
        let stageMsg = 'Loading: ' + stage;
        if (e.data.size !== undefined) {
          stageMsg += ` (${(e.data.size/1024/1024).toFixed(1)} MB)`;
        }
        setStatus(stageMsg);
        addDebugEntry(stageMsg, null, 'progress');
      }
      if (type === 'loaded') {
        addDebugEntry('Sending init message to worker...');
        worker.postMessage({ type: 'init', tools });
        addDebugEntry('Runtime loaded, initializing tools...');
        return;
      }
      if (type === 'result') {
        const start = pending.get(id);
        pending.delete(id);
        const elapsed = start ? ((performance.now() - start) / 1000).toFixed(2) + 's' : '?';
        setRawOutput(output);
        try {
          const parsed = JSON.parse(output);
          let handled = false;

          // Handle new format: { function_calls: [{ name, arguments }, ...] }
          if (parsed && Array.isArray(parsed.function_calls)) {
            for (const call of parsed.function_calls) {
              if (call.name && typeof call.arguments === 'object') {
                handleCommand(call.name, call.arguments);
                handled = true;
              }
            }
          }
          // Fallback: old format { name, arguments }
          else if (parsed && parsed.name && typeof parsed.arguments === 'object') {
            handleCommand(parsed.name, parsed.arguments);
            handled = true;
          }

          if (handled) {
            setStatus(`Executed (${elapsed})`);
          } else {
            setStatus('No command understood (' + elapsed + ')');
          }
        } catch {
          setStatus('Parse failed (' + elapsed + ')');
        }
      }
    };

    function sendToWorker(text) {
      const id = ++pendingId;
      pending.set(id, performance.now());
      worker.postMessage({ type: 'complete', text, id });
      setStatus('Processing…');
      addDebugEntry(`Sending to worker: "${text}" (id: ${id})`);
    }

    function handleCommand(name, args) {
      const amount = typeof args.amount === 'number' ? args.amount : 1;
      switch (name) {
        case 'modify': count += amount; break;
        case 'reset': count = 0; break;
      }
      save(); render();
    }

    // --- Debug typed input ---
    function preprocessTranscript(text) {
      // Fix: model interprets "+N" as negative; convert to "plus N"
      return text.replace(/^\+\s*(\d+)/, 'plus $1');
    }

    debugBtn.onclick = () => {
      const text = preprocessTranscript(debugInput.value.trim());
      if (text) { sendToWorker(text); debugInput.value = ''; }
    };
    debugInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') debugBtn.click(); });

    // --- Speech Recognition ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onresult = (e) => {
        let transcript = e.results[0][0].transcript;
        // Fix: speech recognition outputs "+5" but model interprets "+" as negative
        // Convert "+N" / "+ N" to "plus N" for correct model interpretation
        transcript = transcript.replace(/^\+\s*(\d+)/, 'plus $1');
        micBtn.classList.remove('listening');
        micBtn.textContent = '🎤';
        sendToWorker(transcript);
      };
      recognition.onerror = (e) => {
        micBtn.classList.remove('listening');
        micBtn.textContent = '🎤';
        setStatus('Speech error: ' + e.error);
      };
      recognition.onend = () => {
        micBtn.classList.remove('listening');
        micBtn.textContent = '🎤';
      };
    } else {
      setStatus('Speech Recognition not supported');
    }

    micBtn.onclick = () => {
      if (!workerReady) return;
      if (recognition) {
        micBtn.classList.add('listening');
        micBtn.textContent = '⏺';
        recognition.start();
      }
    };

    // --- Install prompt ---
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); deferredPrompt = e; installHint.classList.add('show');
    });
    installHint.onclick = async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null;
        installHint.classList.remove('show');
      }
    };
    window.addEventListener('appinstalled', () => { installHint.classList.remove('show'); });

    // --- Register Service Worker ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }

    // Initial render
    render();
  </script>
</body>
</html>
